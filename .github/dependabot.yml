version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7.0 lacks the stable compiler API required by typescript-eslint.
      # Dependabot can propose 7.1, when compatible tooling may be available.
      - dependency-name: typescript
        versions:
          - 7.0.x

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
